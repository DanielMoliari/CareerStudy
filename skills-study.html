  * { box-sizing: border-box; margin: 0; padding: 0 }

  @media (max-width: 768px) { .shell { padding: 40px 24px 80px } }

  .back { display: inline-block; margin-bottom: 32px; color: #64748b; text-decoration: none; font-size: 13px; transition: color .15s }
  .back:hover { color: #e2e8f0 }

  /* Header */
  .hdr-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: #ef4444;
    letter-spacing: .22em; text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .hdr-label .ln { width: 36px; height: 1px; background: #ef4444; opacity: .4 }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 900; letter-spacing: -.03em;
    line-height: 1.06; margin-bottom: 12px;
  }
  h1 em { color: #ef4444; font-style: normal }
  .desc {
    color: #94a3b8; font-size: .95rem;
    line-height: 1.7; max-width: 580px;
    margin-bottom: 48px;
  }

  /* Tier rows */
  .tier {
    border-top: 1px solid rgba(255,255,255,.06);
    padding: 22px 0;
  }
  .tier:last-child { border-bottom: 1px solid rgba(255,255,255,.06) }

  .tier-hd {
    display: flex; align-items: center;
    gap: 14px; margin-bottom: 14px;
  }
  .tier-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: .62rem; color: #ef4444;
    letter-spacing: .16em; text-transform: uppercase;
    white-space: nowrap;
  }
  .tier-ln { flex: 1; height: 1px; background: rgba(239,68,68,.1) }
  .tier-ct {
    font-family: 'JetBrains Mono', monospace;
    font-size: .58rem; color: #64748b;
    white-space: nowrap; opacity: .55;
  }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px }

  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 16px;
    background: #111118;
    border: 1px solid rgba(239,68,68,.15);
    border-radius: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem; color: #e2e8f0;
    cursor: default; user-select: none;
    transition: border-color .2s, background .2s, color .2s, box-shadow .2s, transform .15s;
  }
  .chip:hover {
    border-color: rgba(239,68,68,.7);
    background: rgba(239,68,68,.06);
    color: #ef4444;
    box-shadow: 0 0 12px rgba(239,68,68,.2);
    transform: translateY(-1px);
  }
  .chip img {
    width: 16px; height: 16px; flex-shrink: 0;
    border-radius: 2px;
  }

  /* Priority dot */
  .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.p1 { background: #ef4444 }
  .dot.p2 { background: #eab308 }
  .dot.p3 { background: #64748b }

  /* Legend */
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap;
    margin-bottom: 28px; font-size: 12px; color: #64748b;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 6px }

  @media print {
    body { background: #fff; color: #000 }
    .chip { border-color: #ccc; background: #f5f5f5; color: #000 }
    .chip:hover { transform: none; box-shadow: none }
  }
</style>

function render() {
  let totalCount = 0
  DATA.forEach(t => totalCount += t.skills.length)
  const p1 = DATA.reduce((s, t) => s + t.skills.filter(x => x[1] === 1).length, 0)
  const p2 = DATA.reduce((s, t) => s + t.skills.filter(x => x[1] === 2).length, 0)
  const p3 = DATA.reduce((s, t) => s + t.skills.filter(x => x[1] === 3).length, 0)
  document.getElementById('total').textContent =
    totalCount + ' skills — ' + p1 + ' essenciais, ' + p2 + ' importantes, ' + p3 + ' bonus'

  const container = document.getElementById('tiers')
  container.innerHTML = DATA.map(tier => `
    <div class="tier">
      <div class="tier-hd">
        <span class="tier-lbl">${tier.label}</span>
        <span class="tier-ln"></span>
        <span class="tier-ct">${tier.skills.length} tecnologia${tier.skills.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="chips">
        ${tier.skills.map(([name, p]) => {
          const url = iconUrl(name)
          const img = url ? `<img src="${url}" alt="" loading="lazy">` : ''
          return `<span class="chip"><span class="dot p${p}"></span>${img}${name}</span>`
        }).join('')}
      </div>
    </div>
  `).join('')
}

render()
